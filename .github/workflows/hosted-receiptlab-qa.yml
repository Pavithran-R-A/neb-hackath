name: Hosted ReceiptLab synthetic acceptance (zero model calls)
on:
  push:
    branches:
      - recovery/receiptlab-budget-v2-20261030
    paths:
      - scripts/hosted-acceptance.mjs
      - .github/workflows/hosted-receiptlab-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact recovery source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify real hosted synthetic workflows — no NVIDIA credentials or model requests
        run: node scripts/hosted-acceptance.mjs
