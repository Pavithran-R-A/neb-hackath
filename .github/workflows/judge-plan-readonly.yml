name: Judge source pins (read-only; no inference)
on:
  push:
    branches: [main]
    paths: [.github/workflows/judge-plan-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install frozen production dependencies
        run: npm ci --omit=dev
      - name: Generate pins without Nebius credentials or API calls
        shell: bash
        run: |
          set -euo pipefail
          node scripts/workbench-judge.mjs > judge-pins.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const pins=JSON.parse(readFileSync('judge-pins.json','utf8'));
          if(pins.mode!=='plan-only'||pins.modelRequests!==0||pins.sourceCommit!==process.env.GITHUB_SHA||pins.codeTreeDirty!==false||
            ![pins.runtimeSha256,pins.suiteSha256,pins.accountHistoryBaseSha256].every(v=>/^[a-f0-9]{64}$/.test(v)))
            throw Error('Judge pins are not reproducible from exact clean GitHub source');
          const template={
            id:'receiptlab-judge-20261029',
            approved:false,
            authorizationSource:'https://github.com/Pavithran-R-A/neb-hackath/pull/2#issuecomment-6235724302',
            sourceCommit:pins.sourceCommit,
            runtimeSha256:pins.runtimeSha256,
            suiteSha256:pins.suiteSha256,
            accountHistoryBaseSha256:pins.accountHistoryBaseSha256,
            model:'nvidia/Nemotron-3_5-Lightning',
            scenarioIds:['grant-transient','workshop-false-success'],
            maxRequests:4,
            dailyRequests:4,
            sessionRequests:2,
            maxOutputTokens:8192,
            spendLimitUsd:0.5,
            inputUsdPerMillion:0.06,
            outputUsdPerMillion:0.24,
            expiresAt:'2026-12-15T20:00:00Z'
          };
          writeFileSync('judge-config-INACTIVE-TEMPLATE.json',JSON.stringify(template,null,2)+'\n');
          console.log('SOURCE COMMIT',pins.sourceCommit);
          console.log('RUNTIME SHA256',pins.runtimeSha256);
          console.log('SUITE SHA256',pins.suiteSha256);
          console.log('ACCOUNT HISTORY SHA256',pins.accountHistoryBaseSha256);
          console.log('Model calls: ZERO; template approved=false; no protected settings accessed.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: judge-pins-INACTIVE-no-secrets
          path: |
            judge-pins.json
            judge-config-INACTIVE-TEMPLATE.json
          retention-days: 3
