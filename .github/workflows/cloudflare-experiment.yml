name: One-shot Cloudflare HTTPS experiment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: receiptlab-cloudflare-experiment
  cancel-in-progress: false

jobs:
  hosted-journey:
    if: ${{ github.event.action == 'synchronize' && github.repository == 'Pavithran-R-A/neb-hackath' && github.event.pull_request.head.repo.full_name == 'Pavithran-R-A/neb-hackath' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'feat/phase1-verified-completion' && github.event.pull_request.base.ref == 'main' && vars.RECEIPTLAB_EXPERIMENT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Send one bounded authenticated HTTPS journey
        env:
          RECEIPTLAB_EXPERIMENT_URL: ${{ vars.RECEIPTLAB_EXPERIMENT_URL }}
        run: node scripts/cloudflare-experiment-client.mjs
